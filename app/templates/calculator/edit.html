{% extends "base.html" %}

{% block title %}編輯課程紀錄{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{{ url_for('calculator.index') }}">學分試算</a></li>
                <li class="breadcrumb-item active" aria-current="page">編輯課程</li>
            </ol>
        </nav>

        <div class="card shadow rounded-4 border-0">
            <div class="card-header bg-dark text-white py-3">
                <h2 class="h5 mb-0">📝 編輯課程：{{ course.name }}</h2>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('calculator.update_course', id=course.id) }}" method="POST">
                    <div class="mb-4">
                        <label for="name" class="form-label fw-bold">課程名稱</label>
                        <input type="text" class="form-control form-control-lg" id="name" name="name" value="{{ course.name }}" required>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label for="credits" class="form-label fw-bold">學分數</label>
                            <input type="number" step="0.5" class="form-control" id="credits" name="credits" value="{{ course.credits }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="category" class="form-label fw-bold">課程類別</label>
                            <select class="form-select" id="category" name="category" required>
                                <option value="必修" {% if course.category == '必修' %}selected{% endif %}>必修</option>
                                <option value="選修" {% if course.category == '選修' %}selected{% endif %}>選修</option>
                                <option value="通識" {% if course.category == '通識' %}selected{% endif %}>通識</option>
                                <option value="體育/軍訓" {% if course.category == '體育/軍訓' %}selected{% endif %}>體育/軍訓</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="status" class="form-label fw-bold">修習狀態</label>
                        <div class="d-flex gap-3">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="status" id="completed" value="已完成" {% if course.status == '已完成' %}checked{% endif %} onchange="toggleGrades(true)">
                                <label class="form-check-label" for="completed">已完成</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="status" id="studying" value="修習中" {% if course.status == '修習中' %}checked{% endif %} onchange="toggleGrades(false)">
                                <label class="form-check-label" for="studying">修習中</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="status" id="pending" value="待修習" {% if course.status == '待修習' %}checked{% endif %} onchange="toggleGrades(false)">
                                <label class="form-check-label" for="pending">待修習</label>
                            </div>
                        </div>
                    </div>

                    <div id="grade-section" style="{% if course.status != '已完成' %}display: none;{% endif %}">
                        <hr class="my-4">
                        <h5 class="h6 mb-3 text-secondary fw-bold">成績紀錄</h5>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="score" class="form-label fw-bold">百分制成績</label>
                                <input type="number" step="0.1" class="form-control" id="score" name="score" value="{{ course.score if course.score is not none else '' }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="grade" class="form-label fw-bold">等第</label>
                                <select class="form-select" id="grade" name="grade">
                                    <option value="" {% if not course.grade %}selected{% endif %}>無成績</option>
                                    {% for g in ['A+', 'A', 'A-', 'B+', 'B', 'B-', 'C+', 'C', 'C-', 'F'] %}
                                    <option value="{{ g }}" {% if course.grade == g %}selected{% endif %}>{{ g }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-5">
                        <button type="submit" class="btn btn-primary btn-lg">更新紀錄</button>
                        <a href="{{ url_for('calculator.index') }}" class="btn btn-outline-secondary">取消</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleGrades(show) {
        document.getElementById('grade-section').style.display = show ? 'block' : 'none';
    }
</script>
{% endblock %}
